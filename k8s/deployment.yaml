apiVersion: apps/v1
kind: Deployment

metadata:
  name: kubernetes-k8s-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: kubernetes-k8s

  template:
    metadata:
      labels:
        app: kubernetes-k8s

    spec:
      containers:
        - name: kubernetes-k8s-container
          image: kubernetes-k8s:6.0
          imagePullPolicy: Never

          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: kubernetes-k8s-config
                  key: MYSQL_DATABASE

            - name: MYSQL_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: kubernetes-k8s-config
                  key: MYSQL_SERVICE

            - name: MYSQL_ROOT_USER_NAME
              valueFrom:
                secretKeyRef:
                  name: kubernetes-k8s-secret
                  key: MYSQL_ROOT_USER_NAME

            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubernetes-k8s-secret
                  key: MYSQL_ROOT_PASSWORD


          ports:
            - containerPort: 8080

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080

            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
              httpGet:
                path: /actuator/health/readiness
                port: 8080

              periodSeconds: 5
              failureThreshold: 30

          livenessProbe:
              httpGet:
                path: /actuator/health/liveness
                port: 8080

              periodSeconds: 5
              failureThreshold: 3

          resources:
            requests:
              cpu: "3"
              memory: "900Mi"

            limits:
              cpu: "4"
              memory: "2000Mi"