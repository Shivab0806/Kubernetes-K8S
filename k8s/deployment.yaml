apiVersion: apps/v1
kind: Deployment

metadata:
  name: kubernetes-k8s-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: kubernetes-k8s

  template:
    metadata:
      labels:
        app: kubernetes-k8s

    spec:
      containers:
        - name: kubernetes-k8s-container
          image: kubernetes-k8s:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 8080