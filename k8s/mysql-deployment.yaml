apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql

    spec:
      containers:
        - name: mysql-container
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: kubernetes-k8s-config
                  key: MYSQL_DATABASE

            - name: MYSQL_SERVICE
              valueFrom:
                  configMapKeyRef:
                    name : kubernetes-k8s-config
                    key : MYSQL_SERVICE

            - name : MYSQL_ROOT_USER_NAME
              valueFrom:
                secretKeyRef:
                  name : kubernetes-k8s-secret
                  key : MYSQL_ROOT_USER_NAME

            - name : MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubernetes-k8s-secret
                  key: MYSQL_ROOT_PASSWORD

          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql

      volumes:
          - name: mysql-storage
            persistentVolumeClaim:
              claimName: mysql-pvc

---
apiVersion: v1
kind: Service

metadata:
  name: mysql-service

spec:
  selector:
    app: mysql

  ports:
    - port: 3306
      targetPort: 3306

  type: ClusterIP