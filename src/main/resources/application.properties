spring.application.name=Kubernetes-K8S


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.url=jdbc:mysql://${MYSQL_SERVICE:localhost}:3306/${MYSQL_DATABASE:mydatabase}
spring.datasource.username=${MYSQL_ROOT_USER_NAME:root}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:root}

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
